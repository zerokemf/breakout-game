<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080e1b">
  <meta name="description" content="BREAKOUT — 霓虹打磚塊街機。突破陣形，延續連擊。">
  <title>BREAKOUT — 霓虹街機</title>
  <link rel="icon" type="image/svg+xml" href="./assets/images/arcade-mark.svg">
  <link rel="stylesheet" href="./css/game.css?v=2a-drops">
</head>
<body>
  <main class="arcade-shell">
    <header class="masthead">
      <a class="brand" href="./" aria-label="BREAKOUT 首頁"><img src="./assets/images/arcade-mark.svg" width="38" height="38" alt=""><span>BREAK<span class="brand-accent">OUT</span><small>霓虹街機</small></span></a>
      <div class="edition"><span class="status-dot" aria-hidden="true"></span> 第二階段 <span class="edition-divider">/</span> 精準出擊</div>
    </header>
    <section class="game-machine" aria-label="BREAKOUT 遊戲">
      <div class="hud" aria-label="遊戲狀態">
        <div class="hud-cell"><span class="hud-label">分數</span><strong id="score">000000</strong></div>
        <div class="hud-cell"><span class="hud-label">關卡</span><strong id="level">01</strong></div>
        <div class="hud-cell lives-cell"><span class="hud-label">生命</span><strong id="lives">3</strong></div>
        <button id="pauseButton" class="pause-button secondary" type="button" aria-label="暫停遊戲" title="暫停（P 鍵或退出鍵）"><span aria-hidden="true">Ⅱ</span><span class="pause-label">暫停</span></button>
      </div>
      <div id="stage" class="stage">
        <canvas id="gameCanvas" width="1280" height="720" tabindex="0" aria-label="BREAKOUT 遊戲區。使用方向鍵或 A、D 鍵移動擋板；空白鍵發球，P 鍵暫停。">瀏覽器需支援畫布功能才能遊玩 BREAKOUT。</canvas>
        <div id="overlay" class="overlay">
          <section id="panel" class="panel" aria-label="遊戲選單" aria-live="polite">
            <p class="eyebrow">霓虹街機</p><h1 class="title">BREAK<span>OUT</span></h1><p class="subtitle">突破陣形。<br>延續連擊。</p><p class="notice">街機載入中…</p>
          </section>
        </div>
      </div>
      <footer class="controls-bar"><div class="desktop-hint"><kbd>←</kbd><kbd>→</kbd><span>移動</span><i></i><kbd>空白鍵</kbd><span>發球</span><i></i><kbd>P</kbd><span>暫停</span></div><div class="touch-hint">拖曳移動 <span>·</span> 輕觸發球</div><span class="footer-note">再挑戰一次。</span></footer>
    </section>
    <div class="page-footer"><span>經典手感，霓虹新生。</span><span>免下載，立即開玩。</span></div>
  </main>
  <script type="module" src="./js/main.js?v=2a-drops"></script>
</body>
</html>
